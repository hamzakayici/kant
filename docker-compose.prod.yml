# Production override — zubi.noktafikir.com
# Kullanım: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.production up -d --build

services:
  db:
    ports: [] # PostgreSQL dışarı açılmasın

  opencloud-gateway:
    ports: [] # OpenCloud yalnızca Docker ağından erişilsin (gerekirse ayrı subdomain ile açın)

  app:
    env_file:
      - .env.production
    environment:
      AUTH_URL: ${AUTH_URL:-https://zubi.noktafikir.com}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-https://zubi.noktafikir.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://zubi.noktafikir.com}
      TELEGRAM_PUBLIC_APP_URL: ${TELEGRAM_PUBLIC_APP_URL:-https://zubi.noktafikir.com}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET tanımlı olmalı}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL tanımlı olmalı}
      ZUBEE_AUTO_SEED: ${ZUBEE_AUTO_SEED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_SUPERGROUP_ID: ${TELEGRAM_SUPERGROUP_ID:-}
      TELEGRAM_API_ID: ${TELEGRAM_API_ID:-}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:-}
      TELEGRAM_DEFAULT_TOPIC_ID: ${TELEGRAM_DEFAULT_TOPIC_ID:-}
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: zubee-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/zubi.noktafikir.com.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      app:
        condition: service_started

volumes:
  certbot_www:
  certbot_certs:
