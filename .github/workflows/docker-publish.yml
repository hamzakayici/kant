name: Publish Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            tag: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.tag }})
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/hamzakayici/kant:${{ matrix.tag }}
            ghcr.io/hamzakayici/kant:${{ matrix.tag }}-${{ github.sha }}

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create multi-arch latest tag
        run: |
          docker buildx imagetools create -t ghcr.io/hamzakayici/kant:latest \
            ghcr.io/hamzakayici/kant:amd64 \
            ghcr.io/hamzakayici/kant:arm64
          docker buildx imagetools create -t ghcr.io/hamzakayici/kant:${{ github.sha }} \
            ghcr.io/hamzakayici/kant:amd64-${{ github.sha }} \
            ghcr.io/hamzakayici/kant:arm64-${{ github.sha }}

      - name: Make GHCR package public
        continue-on-error: true
        run: gh api --method PATCH /user/packages/container/kant -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
